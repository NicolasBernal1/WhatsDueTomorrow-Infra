name: Build, Test and Push Docker Images
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - name: backend
            context: ./WhatsDueTomorrow-Backend
            dockerfile: ./WhatsDueTomorrow-Backend/dockerfile
            image: backend-wdt
          - name: frontend
            context: ./WhatsDueTomorrow-Frontend
            dockerfile: ./WhatsDueTomorrow-Frontend/dockerfile
            image: frontend-wdt
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: ${{ matrix.service.context }}
        run: npm install
      - name: Run tests (Backend)
        if: matrix.service.name == 'backend'
        working-directory: ${{ matrix.service.context }}
        run: npm run test
      - name: Run tests (Frontend)
        if: matrix.service.name == 'frontend'
        working-directory: ${{ matrix.service.context }}
        run: npm run test -- --watch=false --browsers=ChromeHeadless
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Extract short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      - name: Build image
        run: |
          docker build \
            -f ${{ matrix.service.dockerfile }} \
            -t ${{ secrets.DOCKER_USER }}/${{ matrix.service.image }}:${{ steps.vars.outputs.sha_short }} \
            -t ${{ secrets.DOCKER_USER }}/${{ matrix.service.image }}:latest \
            ${{ matrix.service.context }}
      - name: Push image
        run: |
          docker push ${{ secrets.DOCKER_USER }}/${{ matrix.service.image }}:${{ steps.vars.outputs.sha_short }}
          docker push ${{ secrets.DOCKER_USER }}/${{ matrix.service.image }}:latest
