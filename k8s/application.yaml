apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: whatsduetomorrow
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/NicolasBernal1/WhatsDueTomorrow-Infra.git
    targetRevision: main
    path: kube

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true